<title>Protótipo Cor por Pokémon</title>
<!--
  PROTÓTIPO DESCARTÁVEL (Dexplica, 11/10/2026).
  Pergunta: a Página do Pokémon deve mudar de cor conforme a paleta do próprio Pokémon?
  Variações (?variant=A|B|C): A = cor extraída do sprite; B = cor dos tipos; C = cor fixa da identidade.
  No topo: base do site (A azul-marinho e creme / B grafite) e tema claro ou escuro.
  Correção de fontes: pixel (Pixelify Sans) só em títulos grandes; números, tipos e textos em Nunito.
  A cor de destaque é ajustada sozinha até passar no contraste WCAG AA (4,5:1) contra o fundo.
  Ícones: Phosphor Icons (MIT). Sprites: Showdown, via jsDelivr (PokeAPI).
-->

<style>
:root[data-base="A"] { --bg: #f7ecd2; --surface: #fffaf0; --text: #0c1733; --muted: #5b6b86; --line: #0c1733; --brand: #2563eb; --bw: 2px; --hard: 4px 4px 0 #0c1733; --radius: 12px; }
:root[data-base="A"][data-mode="dark"] { --bg: #0b1530; --surface: #12254f; --text: #fbefcf; --muted: #9fb2d6; --line: #31508f; --brand: #6aa6ff; --hard: 4px 4px 0 #050b1a; }
:root[data-base="B"] { --bg: #f4f5f7; --surface: #ffffff; --text: #16181d; --muted: #5f6470; --line: #dfe2e8; --brand: #1f6fd1; --bw: 1px; --hard: 0 1px 2px rgba(0,0,0,.06); --radius: 10px; }
:root[data-base="B"][data-mode="dark"] { --bg: #15161a; --surface: #1e2026; --text: #e7e8ec; --muted: #9a9ca6; --line: #30333b; --brand: #4ea1ff; --hard: 0 1px 2px rgba(0,0,0,.4); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 "Nunito", system-ui, sans-serif; padding-bottom: 90px; }
.pixel { font-family: "Pixelify Sans", system-ui, sans-serif; }
.num { font-family: "Nunito", system-ui, sans-serif; font-variant-numeric: tabular-nums; font-weight: 800; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 20px; background: var(--surface); border-bottom: var(--bw) solid var(--line); }
.logo { font-size: 24px; font-weight: 700; } .logo span { color: var(--brand); }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: color-mix(in srgb, var(--text) 8%, transparent); }
.seg button { border: 0; background: none; color: var(--muted); padding: 5px 10px; border-radius: 8px; font: 700 13px "Nunito", sans-serif; cursor: pointer; }
.seg button.on { background: var(--brand); color: #fff; }
.lbl { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 22px 20px; }
.intro { color: var(--muted); max-width: 75ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 18px; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
.hero { border-radius: calc(var(--radius) + 4px); padding: 18px; display: grid; grid-template-columns: 130px 1fr; gap: 14px 18px; align-items: center;
  background: linear-gradient(160deg, var(--h1), var(--h2)); color: var(--ht); border: var(--bw) solid var(--line); box-shadow: var(--hard); }
.hero .spr { height: 130px; display: grid; place-items: center; }
.hero .spr img { max-width: 130px; max-height: 125px; }
.hero h2 { font-size: 34px; margin: 0; line-height: 1; letter-spacing: .02em; }
.hero .sub { font-size: 13px; opacity: .8; font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.type { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 8px; border-radius: 7px; background: var(--tc); color: #fff; font-weight: 800; font-size: 13px;
  border: 2px solid rgba(0,0,0,.35); text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.type i { font-size: 14px; }
.perfil span { padding: 2px 10px; border-radius: 999px; font-weight: 800; font-size: 12px; background: color-mix(in srgb, var(--ht) 14%, transparent); }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: color-mix(in srgb, var(--ht) 8%, transparent); border-radius: var(--radius); padding: 8px; text-align: center; }
.stats small { display: block; font-size: 11px; font-weight: 700; opacity: .75; }
.stats b { font-size: 18px; }
.demo { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tab { border: 0; padding: 7px 14px; border-radius: 8px; font: 800 14px "Nunito", sans-serif; background: var(--acc); color: var(--acc-ink); }
.jargao { font-weight: 800; color: var(--acc-on-bg); text-decoration: underline dotted 2px; text-underline-offset: 3px; }
.ratio { grid-column: 1 / -1; font-size: 12px; opacity: .85; font-weight: 700; }
.ratio .ok { color: inherit; }
#switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 4px;
  background: #111; color: #fff; border-radius: 999px; padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.35); font: 14px system-ui, sans-serif; }
#switcher button { background: #2a2a2a; color: #fff; border: 0; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px; }
#switcher span { padding: 0 12px; white-space: nowrap; }
#switcher em { font-style: normal; background: #ffcc00; color: #111; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; margin-right: 6px; }
</style>

<script>
const MONS = JSON.parse(document.getElementById("data").textContent);
const TYPE_COLOR = { Normal:"#9a9a6e", Fire:"#e8772b", Water:"#5585ea", Electric:"#d9b51f", Grass:"#5fae3a", Ice:"#4fb3ae", Fighting:"#c22e28", Poison:"#a33ea1", Ground:"#c9a443", Flying:"#8f74e6", Psychic:"#f04b7c", Bug:"#93a51a", Rock:"#a8962f", Ghost:"#735797", Dragon:"#6034ef", Dark:"#6b5446", Steel:"#8f8fae", Fairy:"#d0689c" };
const TYPE_ICON = { Normal:"circle", Fire:"fire", Water:"drop", Electric:"lightning", Grass:"leaf", Ice:"snowflake", Fighting:"boxing-glove", Poison:"skull", Ground:"mountains", Flying:"feather", Psychic:"brain", Bug:"bug-beetle", Rock:"cube", Ghost:"ghost", Dragon:"fire", Dark:"moon", Steel:"gear", Fairy:"sparkle" };
const BASE = {
  A: { light: { bg: "#f7ecd2", text: "#0c1733", alt: "#fbefcf", brand: "#2563eb" }, dark: { bg: "#0b1530", text: "#fbefcf", alt: "#0c1733", brand: "#6aa6ff" } },
  B: { light: { bg: "#f4f5f7", text: "#16181d", alt: "#e7e8ec", brand: "#1f6fd1" }, dark: { bg: "#15161a", text: "#e7e8ec", alt: "#16181d", brand: "#4ea1ff" } },
};
const VARS = [["A", "Cor do próprio Pokémon (sprite)"], ["B", "Cor dos tipos"], ["C", "Cor fixa da identidade"]];
const STAT_PT = { hp: "HP", atk: "Atq", def: "Def", spa: "Atq. E.", spd: "Def. E.", spe: "Vel" };

// ---------- Cor ----------
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const hex = c => "#" + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");
const mix = (a, b, t) => hex(rgb(a).map((v, i) => v + (rgb(b)[i] - v) * t)); // t=0 -> a, t=1 -> b
const lum = h => { const [r, g, b] = rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); };
function legivel(cor, fundo, alvo = 4.5) { // empurra a cor para longe do fundo até passar no contraste
  const dir = lum(fundo) > .4 ? "#000000" : "#ffffff";
  for (let t = 0; t <= 1.0001; t += .05) { const c = mix(cor, dir, t); if (contrast(c, fundo) >= alvo) return { cor: c, ajuste: Math.round(t * 100) }; }
  return { cor: dir, ajuste: 100 };
}
function botao(cor, fundo) { // fundo do botão visível (3:1) e texto dentro dele legível (4,5:1)
  let c = legivel(cor, fundo, 3).cor;
  for (let t = 0; t <= 1.0001; t += .05) {
    const x = mix(c, "#000000", t);
    if (contrast("#ffffff", x) >= 4.5) return { cor: x, ink: "#ffffff" };
    if (t === 0 && contrast("#111111", x) >= 4.5) return { cor: x, ink: "#111111" };
  }
  return { cor: "#000000", ink: "#ffffff" };
}
function tema(mon) {
  const st = { variant: state.variant, base: BASE[state.base][state.modo] };
  const pri = state.variant === "A" ? mon.paleta[0] : state.variant === "B" ? TYPE_COLOR[mon.types[0]] : st.base.brand;
  const sec = state.variant === "A" ? mon.paleta[1] : state.variant === "B" ? TYPE_COLOR[mon.types[1] || mon.types[0]] : st.base.brand;
  const escuro = state.modo === "dark";
  const h1 = escuro ? mix(pri, st.base.bg, .62) : mix(pri, "#ffffff", .72);
  const h2 = escuro ? mix(sec, st.base.bg, .8) : mix(sec, "#ffffff", .86);
  const meio = mix(h1, h2, .5);
  const ht = contrast(st.base.text, meio) >= contrast(st.base.alt, meio) ? st.base.text : st.base.alt;
  const acc = botao(pri, meio), accInk = acc.ink;
  const onBg = legivel(pri, meio, 4.5);       // texto colorido (Jargão): 4,5:1
  return { h1, h2, ht, acc: acc.cor, accInk, onBg: onBg.cor, ajuste: onBg.ajuste, cText: contrast(ht, meio), cJ: contrast(onBg.cor, meio) };
}
function perfil(s) {
  const lado = Math.abs(s.atk - s.spa) <= 10 ? "Misto" : s.atk > s.spa ? "Físico" : "Especial";
  const off = Math.max(s.atk, s.spa), def = (s.hp + s.def + s.spd) / 3;
  return [lado, off - def > 15 ? "Ofensivo" : off - def < -15 ? "Defensivo" : "Equilibrado", s.spe >= 100 ? "Rápido" : s.spe <= 70 ? "Lento" : "Médio"];
}
const fmt = n => n.toLocaleString("pt-BR", { maximumFractionDigits: 1 });

// ---------- Estado ----------
const params = new URLSearchParams(location.search);
const state = { variant: VARS.some(v => v[0] === params.get("variant")) ? params.get("variant") : "A",
  base: params.get("base") === "B" ? "B" : "A", modo: params.get("tema") === "claro" ? "light" : "dark" };
function set(p) { Object.assign(state, p); history.replaceState(null, "", "?" + new URLSearchParams({ variant: state.variant, base: state.base, tema: state.modo === "light" ? "claro" : "escuro" })); render(); }
function render() {
  document.documentElement.dataset.base = state.base; document.documentElement.dataset.mode = state.modo;
  document.getElementById("bases").innerHTML = [["A", "A · azul-marinho e creme"], ["B", "B · grafite"]].map(([k, l]) => `<button data-base="${k}" class="${state.base === k ? "on" : ""}">${l}</button>`).join("");
  document.getElementById("modos").innerHTML = [["light", "Claro"], ["dark", "Escuro"]].map(([k, l]) => `<button data-modo="${k}" class="${state.modo === k ? "on" : ""}">${l}</button>`).join("");
  const v = VARS.find(x => x[0] === state.variant);
  document.getElementById("titulo").textContent = v[1];
  document.getElementById("intro").textContent = { A: "A cor vem do próprio sprite: as duas cores dominantes e saturadas, ignorando contorno, branco e cinza. Calculada uma vez, no importador.", B: "A cor vem do primeiro tipo do Pokémon. Simples e previsível, mas todo Water fica igual.", C: "Sem cor por Pokémon: só a cor da identidade. É a referência para comparar." }[state.variant];
  document.getElementById("vlabel").textContent = `${v[0]} · ${v[1]}`;
  document.getElementById("grid").innerHTML = MONS.map(m => {
    const t = tema(m), total = Object.values(m.stats).reduce((a, b) => a + b, 0);
    return `<article class="hero" style="--h1:${t.h1};--h2:${t.h2};--ht:${t.ht};--acc:${t.acc};--acc-ink:${t.accInk};--acc-on-bg:${t.onBg}">
      <div class="spr"><img src="${m.sprite}" alt="${m.name}"></div>
      <div><div class="sub">#${m.num}</div><h2 class="pixel">${m.name}</h2>
        <div class="chips">${m.types.map(ty => `<span class="type" style="--tc:${TYPE_COLOR[ty]}"><i class="ph-fill ph-${TYPE_ICON[ty]}"></i>${ty}</span>`).join("")}</div>
        <div class="chips perfil">${perfil(m.stats).map(p => `<span>${p}</span>`).join("")}</div></div>
      <div class="stats">${Object.entries(m.stats).map(([k, v]) => `<div><small>${STAT_PT[k]}</small><b class="num">${v}</b></div>`).join("")}<div><small>Total</small><b class="num">${total}</b></div></div>
      <div class="demo"><button class="tab">Aba ativa</button><span>Papel: <span class="jargao">Wallbreaker</span></span></div>
      <div class="ratio">Contraste do texto ${fmt(t.cText)}:1 · do Jargão ${fmt(t.cJ)}:1 ${t.cJ >= 4.5 ? "✓ AA" : "✗"}${t.ajuste ? ` · cor do Jargão escurecida/clareada ${t.ajuste}% para passar` : ""}</div>
    </article>`;
  }).join("");
}
document.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.base) set({ base: b.dataset.base }); if (b.dataset.modo) set({ modo: b.dataset.modo }); });
const cycle = d => { const i = VARS.findIndex(v => v[0] === state.variant); set({ variant: VARS[(i + d + VARS.length) % VARS.length][0] }); };
document.getElementById("prev").onclick = () => cycle(-1); document.getElementById("next").onclick = () => cycle(1);
document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1); });
set({});
</script>
</body>
